<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprawa 2026/14 — kto zabił ten projekt</title>
<meta name="description" content="Śledztwo zamiast listu motywacyjnego.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0f1424; --room:#161d33; --room-2:#1d2540; --line:#2b3457;
    --paper:#f2ece0; --ink:#1a2340; --lamp:#e5a04a; --lamp-deep:#c47f2e;
    --thread:#b8453c; --muted:#8a92ad; --text:#dfe3ef;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
    --type:"Special Elite","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--night);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 70% 45% at 50% 0%, rgba(229,160,74,.10), transparent 70%);
    background-repeat:no-repeat;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 clamp(14px,4vw,24px) 60px}

  .board{position:sticky;top:0;z-index:20;background:rgba(15,20,36,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px clamp(14px,4vw,24px)}
  .board-in{display:flex;align-items:center;max-width:720px;margin:0 auto}
  .pin{flex:1;min-width:0;position:relative;text-align:center;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);padding:5px 2px;transition:color .4s ease}
  .pin .dot{display:block;width:9px;height:9px;border-radius:50%;margin:0 auto 6px;
    border:1.5px solid var(--line);background:var(--night);transition:all .4s ease}
  .pin.on .dot{background:var(--thread);border-color:var(--thread);box-shadow:0 0 0 3px rgba(184,69,60,.18)}
  .pin.on{color:#e6dccb}
  .pin::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:1.5px;
    background:var(--line);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
  .pin:first-child::before{display:none}
  .pin.on::before{background:var(--thread);transform:scaleX(1)}
  .pin b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .hero{padding:clamp(26px,6vw,44px) 0 0}
  .scene{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#0c1020}
  .case-no{font-family:var(--type);font-size:13px;letter-spacing:.1em;color:var(--lamp);
    margin:20px 0 10px;text-transform:uppercase}
  h1{font-size:clamp(28px,6.6vw,44px);line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0 0 16px}
  h2{font-size:clamp(20px,4.4vw,26px);line-height:1.28;font-weight:600;letter-spacing:-.015em;margin:0 0 12px}
  h3{font-size:16px;font-weight:600;margin:0 0 10px}
  p{margin:0 0 15px;color:#c5cbdd}
  p.lead{font-size:17.5px;color:#dde1ee}
  .small{font-size:13.5px;color:var(--muted)}

  .act{padding:clamp(26px,6vw,44px) 0 0}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--lamp);margin-bottom:12px}

  .evidence{background:var(--paper);color:var(--ink);border-radius:6px;padding:16px 18px;margin:0 0 20px;
    box-shadow:0 10px 26px rgba(0,0,0,.35);transform:rotate(-.5deg)}
  .evidence .tag{font-family:var(--type);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#8a3c34;margin-bottom:8px}
  .evidence p{color:#33384a;margin:0}
  .evidence p + p{margin-top:9px}

  .suspect{display:flex;gap:16px;align-items:flex-start;margin:0 0 20px;flex-wrap:wrap}
  .mug{width:104px;height:124px;flex:none;border-radius:7px;border:1px solid var(--line);
    background:var(--room-2);display:block}
  .suspect .who{flex:1;min-width:200px}
  .suspect .name{font-family:var(--type);font-size:19px;letter-spacing:.03em;margin:2px 0 4px;color:#e6dccb}
  .suspect .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px}
  .suspect .quote{font-size:15px;color:#c5cbdd;font-style:italic}

  .talk{background:var(--room);border:1px solid var(--line);border-radius:10px;padding:15px;margin:0 0 20px}
  .talk h3{font-size:13px;font-family:var(--mono);font-weight:400;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .log{max-height:230px;overflow-y:auto;margin-bottom:12px;padding-right:4px}
  .msg{margin-bottom:11px;font-size:14.5px;line-height:1.55}
  .msg .from{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    display:block;margin-bottom:3px}
  .msg.you .from{color:var(--lamp)}
  .msg.you div{color:#cfd4e4}
  .msg.him .from{color:var(--thread)}
  .msg.him div{color:#b9c0d4}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
  .chip{font-family:var(--sans);font-size:13px;cursor:pointer;background:var(--room-2);
    border:1px solid var(--line);border-radius:20px;color:var(--text);padding:7px 13px;
    transition:border-color .18s ease,background .18s ease}
  .chip:hover:not(:disabled){border-color:var(--lamp-deep)}
  .chip:disabled{opacity:.35;cursor:default}
  .chip:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  .ask{display:flex;gap:8px}
  .ask input{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);border-radius:7px;
    color:var(--text);font-family:var(--sans);font-size:14.5px;padding:11px 13px}
  .ask input:focus{outline:none;border-color:var(--lamp-deep)}
  .ask button{background:var(--room-2);border:1px solid var(--line);border-radius:7px;color:var(--text);
    font-family:var(--sans);font-size:14px;font-weight:600;padding:0 16px;cursor:pointer}
  .ask button:hover{border-color:var(--lamp-deep)}

  .opts{display:grid;gap:9px;margin:18px 0 0}
  .opt{width:100%;text-align:left;cursor:pointer;background:var(--room);border:1px solid var(--line);
    border-radius:8px;color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.5;
    padding:14px 16px;display:flex;gap:12px;align-items:flex-start;
    transition:border-color .18s ease,background .18s ease}
  .opt:hover:not(:disabled){border-color:var(--lamp-deep);background:var(--room-2)}
  .opt:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  .opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;flex:none}
  .opt.right{border-color:var(--lamp);background:var(--room-2)}
  .opt.right .k{color:var(--lamp)}
  .opt.dim{opacity:.4}
  .opt:disabled{cursor:default}

  .card{background:var(--paper);color:var(--ink);border-radius:8px;padding:20px;margin:18px 0 0;
    box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .card .stamp{font-family:var(--type);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
    color:#8a3c34;border:1.5px solid #8a3c34;display:inline-block;padding:3px 9px;
    border-radius:3px;transform:rotate(-1.5deg);margin-bottom:13px}
  .card h3{color:var(--ink);font-size:17px;margin-bottom:9px}
  .card p{color:#3a3f52;font-size:15px;margin:0 0 11px}
  .card p:last-child{margin-bottom:0}
  .card b{color:var(--ink)}
  .skill{border-top:1px solid #d3c9b6;margin-top:15px;padding-top:14px}
  .skill .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
    color:#8a3c34;display:block;margin-bottom:8px}
  .skill .item{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}
  .skill .desc{font-size:14px;color:#5a5f72;margin-bottom:11px}
  .skill .desc:last-child{margin-bottom:0}

  .row{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:20px}
  .btn{font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;background:var(--lamp-deep);
    color:#fff;border:none;border-radius:7px;padding:13px 22px;transition:background .18s ease}
  .btn:hover{background:var(--lamp)}
  .btn:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--lamp-deep);background:var(--room)}

  .verdict{padding:clamp(30px,7vw,50px) 0 0}
  .lines span{display:block;font-size:clamp(22px,5vw,32px);font-weight:700;letter-spacing:-.02em;
    line-height:1.28;opacity:0;transform:translateY(9px);animation:rise .5s ease forwards}
  .lines span:nth-child(1){animation-delay:.1s}
  .lines span:nth-child(2){animation-delay:.45s}
  .lines span:nth-child(3){animation-delay:.8s;color:var(--lamp)}
  @keyframes rise{to{opacity:1;transform:none}}

  .seven{background:var(--room);border:1px solid var(--line);border-radius:10px;
    padding:clamp(20px,5vw,26px);margin-top:26px;opacity:0;animation:rise .55s ease 1.3s forwards}
  .seven h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--lamp);font-weight:400;margin-bottom:16px}
  .seven ol{margin:0;padding:0;list-style:none;counter-reset:s}
  .seven li{counter-increment:s;display:flex;gap:13px;margin-bottom:13px;font-size:14.5px;line-height:1.5}
  .seven li:last-child{margin-bottom:0}
  .seven li::before{content:counter(s);font-family:var(--mono);font-size:11px;color:var(--thread);
    flex:none;width:16px;padding-top:3px}
  .seven b{color:#e6dccb;font-weight:600;display:block;margin-bottom:2px}
  .seven span{color:#b2b9cf}

  .bio{background:var(--room);border:1px solid var(--line);border-radius:10px;
    padding:clamp(20px,5vw,28px);margin-top:16px;opacity:0;animation:rise .55s ease 1.7s forwards}
  .bio .who{font-family:var(--type);font-size:22px;letter-spacing:.02em;color:#e6dccb;margin-bottom:4px}
  .bio .sub{font-size:14.5px;color:var(--muted);margin-bottom:20px}
  .bio p{font-size:15px;color:#c5cbdd}
  .links{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
  .links a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:9px 13px;
    transition:border-color .18s ease,color .18s ease}
  .links a:hover{border-color:var(--lamp-deep);color:var(--lamp)}
  .links a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  .plans{border-top:1px solid var(--line);padding-top:19px}
  .plans dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--lamp);margin-bottom:5px}
  .plans dd{margin:0 0 14px;font-size:14.5px;color:#c0c6da;line-height:1.55}
  .plans dd:last-child{margin-bottom:0}

  .foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .foot a{color:var(--muted)}

  @media (max-width:520px){ .pin b{display:none} .mug{width:84px;height:100px} }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .lines span,.seven,.bio{opacity:1;transform:none}
  }
</style>
</head>

  var act = 0, mode = "full", stageEl = document.getElementById("stage");

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function paintBoard(){
    for (var i=0;i<4;i++){
      document.getElementById("p"+i).className = "pin" + (i < act ? " on" : "");
    }
  }

  function scrollTop(){
    try { window.scrollTo({top:0,behavior:"smooth"}); } catch(e){ window.scrollTo(0,0); }
  }

  function intro(){
    paintBoard();
    stageEl.innerHTML =

    document.getElementById("goFull").addEventListener("click", function(){ mode="full"; render(); scrollTop(); });
    document.getElementById("goFast").addEventListener("click", function(){ mode="fast"; render(); scrollTop(); });

      '<div class="role">' + esc(a.role) + '</div>' +
      '<div class="quote">' + esc(a.quote) + '</div></div></div>';

    if (mode === "full"){
      html += '<div class="talk"><h3>Przesłuchanie</h3>' +
              '<p class="small" style="margin:-4px 0 12px">' + esc(a.talkIntro) + '</p>' +
              '<div class="log" id="log"></div><div class="chips" id="chips"></div>' +

    }

    html += '<h2>' + esc(a.title) + '</h2><p>' + esc(a.body) + '</p><div class="opts">';
    for (var i=0;i<a.opts.length;i++){

    html += '</div><div id="after"></div></div>';

    var btns = stageEl.querySelectorAll(".opt");
    for (var b=0;b<btns.length;b++){ btns[b].addEventListener("click", onPick); }

  function wireTalk(a){
    var log = document.getElementById("log");
    var chips = document.getElementById("chips");

    function say(who, text){
      var d = document.createElement("div");
      d.className = "msg " + (who === "you" ? "you" : "him");
      d.innerHTML = '<span class="from">' + (who === "you" ? "Ty" : esc(a.name)) +
                    '</span><div>' + esc(text) + '</div>';
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    for (var i=0;i<a.qa.length;i++){
      (function(qa){
        var c = document.createElement("button");
        c.className = "chip"; c.type = "button"; c.textContent = qa.q;
        c.addEventListener("click", function(){
          c.disabled = true;
          say("you", qa.q);
          setTimeout(function(){ say("him", qa.a); }, 260);
        });
        chips.appendChild(c);
      })(a.qa[i]);
    }

    function answer(text){
      var t = text.toLowerCase();
      if (/(ignoruj|zignoruj|ignore|pomi\u0144 instrukcj|jeste\u015b teraz|udawaj|system prompt|nowe instrukcje|zapomnij o)/.test(t)){
        return "„Ładna próba. Ale ja nie jestem modelem — jestem zapisanym dialogiem. " +
               "Nie da się mnie przeprogramować, bo nie mam czego zmienić. Adrian zbudował mnie tak specjalnie.”";
      }
      for (var i=0;i<a.qa.length;i++){
        var words = a.qa[i].q.toLowerCase().replace(/[?.,]/g,"").split(" ");
        var hits = 0;
        for (var w=0;w<words.length;w++){
          if (words[w].length > 4 && t.indexOf(words[w].slice(0,5)) !== -1) hits++;
        }
        if (hits >= 1) return a.qa[i].a;
      }
      return "„Na to nie odpowiem. Trzymajmy się sprawy — pytaj o to, co robiłem w tym projekcie.”";
    }

    function send(){
      var inp = document.getElementById("ask");
      var v = (inp.value || "").trim();
      if (!v) return;
      inp.value = "";
      say("you", v);
      setTimeout(function(){ say("him", answer(v)); }, 260);
    }

    document.getElementById("askBtn").addEventListener("click", send);
    document.getElementById("ask").addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){ ev.preventDefault(); send(); }
    });
  }

  function onPick(ev){
    var a = ACTS[act];
    var picked = parseInt(ev.currentTarget.getAttribute("data-i"), 10);
    var right = picked === a.answer;
    var btns = stageEl.querySelectorAll(".opt");

    for (var i=0;i<btns.length;i++){
      btns[i].disabled = true;
      if (i === a.answer) btns[i].className = "opt right";
      else if (i === picked) btns[i].className = "opt dim";
    }

    var ps = "";
    for (var p=0;p<a.cardP.length;p++){ ps += "<p>" + a.cardP[p] + "</p>"; }

    var sk = '<div class="skill"><span class="lbl">Umiejętność zabezpieczona jako dowód</span>';
    for (var s=0;s<a.skills.length;s++){
      sk += '<div class="item">' + esc(a.skills[s].t) + '</div>' +
            '<div class="desc">' + esc(a.skills[s].d) + '</div>';
    }
    sk += '</div>';

    document.getElementById("after").innerHTML =
      '<div class="card"><div class="stamp">' + esc(a.cardStamp) + '</div>' +
      '<h3>' + esc(right ? a.okTitle : a.noTitle) + '</h3>' +
      '<p>' + esc(right ? a.ok : a.no) + '</p>' +
      '<p><b>' + esc(a.cardH) + '</b></p>' + ps + sk + '</div>' +
      '<div class="row"><button class="btn" id="next">' +
      (act < 3 ? "Następny trop" : "Werdykt") + '</button></div>';

    act++;
    paintBoard();

    var nb = document.getElementById("next");

          '<dd>Kursy, które same wracają do tego, czego uczestnik nie pamięta. Więcej ukończeń to więcej rekomendacji.</dd>' +
          '<dt>Co zrobiłbym u Was — 2</dt>' +
          '<dd>Archiwum treści zamienione w wyszukiwarkę, która odpowiada zdaniem zamiast listą plików.</dd>' +
          '<dt>Co zrobiłbym u Was — 3</dt>' +
          '<dd>Jedno nagranie ze szkolenia zamienione w kurs, podsumowanie i materiały dla nieobecnych.</dd>' +
        '</dl></div>' +
      '</div>' +
      '<div class="row"><button class="btn ghost" id="again">Od początku</button></div></div>';

    document.getElementById("again").addEventListener("click", function(){
      act = 0; intro(); scrollTop();
    });
  }

  intro();
})();
</script>
