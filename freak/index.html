<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specyfikacja kandydata — Adrian Wojtasik</title>
<meta name="description" content="Trzy pytania zamiast listu motywacyjnego.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141a2e;
    --surface:#1b2340;
    --surface-2:#212a4b;
    --line:#2e3a63;
    --ink:#eceef4;
    --muted:#949cba;
    --accent:#e58b42;
    --accent-deep:#c96a2a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:clamp(16px,4vw,56px) clamp(16px,4vw,24px);
  }
  .wrap{width:100%;max-width:680px}

  /* ---- document chrome ---- */
  .doc-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .stamp{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);
  }
  .stamp b{color:var(--accent);font-weight:500}

  /* ---- progress ---- */
  .rail{display:flex;gap:8px;margin-top:0}
  .tick{
    width:34px;height:3px;background:var(--line);border-radius:2px;transition:background .35s ease;
  }
  .tick.done{background:var(--accent)}
  .tick.now{background:var(--muted)}

  /* ---- stage ---- */
  .stage{padding:clamp(28px,6vw,48px) 0 0}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:14px;
  }
  h1{
    font-size:clamp(28px,6vw,42px);line-height:1.12;font-weight:700;letter-spacing:-.02em;
    margin:0 0 18px;
  }
  h2{
    font-size:clamp(21px,4.4vw,27px);line-height:1.25;font-weight:600;letter-spacing:-.015em;
    margin:0 0 14px;
  }
  p{margin:0 0 16px;color:#c9cee0}
  p.lead{font-size:17px;color:#d5d9e8}
  .muted{color:var(--muted);font-size:14px}

  /* ---- rule card (recognition over recall) ---- */
  .rule{
    background:var(--surface);border-left:2px solid var(--accent-deep);
    padding:16px 18px;margin:0 0 22px;border-radius:0 6px 6px 0;
  }
  .rule .label{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:7px;
  }
  .rule code{font-family:var(--mono);font-size:13.5px;color:var(--ink);line-height:1.7}

  /* ---- options ---- */
  .opts{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none}
  .opt{
    width:100%;text-align:left;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5;
    padding:15px 17px;display:flex;gap:13px;align-items:flex-start;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--accent-deep);background:var(--surface-2)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt .key{
    font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;flex:none;
  }
  .opt.correct{border-color:var(--accent);background:var(--surface-2)}
  .opt.correct .key{color:var(--accent)}
  .opt.wrong{opacity:.45}
  .opt:disabled{cursor:default}

  /* ---- feedback ---- */
  .fb{
    margin-top:18px;padding:15px 17px;border-radius:8px;background:var(--surface);
    border:1px solid var(--line);font-size:15px;color:#cdd2e2;
  }
  .fb strong{color:var(--ink);font-weight:600}
  .fb.hidden{display:none}

  /* ---- actions ---- */
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}
  .btn{
    font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;
    background:var(--accent-deep);color:#fff;border:none;border-radius:7px;
    padding:13px 24px;transition:background .18s ease;
  }
  .btn:hover{background:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent-deep);background:var(--surface)}

  /* ---- collected keys ---- */
  .keys{
    margin-top:auto;padding-top:26px;border-top:1px solid var(--line);
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .slot{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
    border:1px dashed var(--line);border-radius:5px;padding:7px 12px;color:var(--muted);
    transition:all .4s ease;
  }
  .slot.filled{border-style:solid;border-color:var(--accent-deep);color:var(--accent);background:rgba(201,106,42,.07)}

  /* ---- reveal ---- */
  .method{margin:0 0 26px}
  .method span{
    display:block;font-size:clamp(24px,5.4vw,34px);font-weight:700;letter-spacing:-.02em;
    line-height:1.25;opacity:0;transform:translateY(8px);
    animation:rise .55s ease forwards;
  }
  .method span:nth-child(1){animation-delay:.15s}
  .method span:nth-child(2){animation-delay:.55s}
  .method span:nth-child(3){animation-delay:.95s;color:var(--accent)}
  @keyframes rise{to{opacity:1;transform:none}}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:clamp(22px,5vw,30px);margin-top:8px;
    opacity:0;animation:rise .6s ease 1.5s forwards;
  }
  .card .verdict{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:16px;
  }
  .card h2{margin-bottom:8px}
  .card .name{font-size:15px;color:var(--muted);margin-bottom:22px}
  .links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .links a{
    font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;text-decoration:none;
    color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 14px;
    transition:border-color .18s ease,color .18s ease;
  }
  .links a:hover{border-color:var(--accent-deep);color:var(--accent)}
  .links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .decode{border-top:1px solid var(--line);padding-top:20px}
  .decode dt{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--accent);margin-bottom:5px;
  }
  .decode dd{margin:0 0 15px;font-size:14.5px;color:#c2c8dc;line-height:1.55}
  .decode dd:last-child{margin-bottom:0}

  .foot{margin-top:34px;font-size:13px;color:var(--muted)}
  .foot a{color:var(--muted)}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
    .method span,.card{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="doc-head">
    <div class="stamp">Specyfikacja kandydata · <b id="addressee">Forum Media Polska</b></div>
    <div class="rail" aria-hidden="true">
      <div class="tick" id="t0"></div><div class="tick" id="t1"></div><div class="tick" id="t2"></div>
    </div>
  </header>

  <main id="stage" class="stage" aria-live="polite"></main>

  <div class="keys" id="keys" aria-label="Zebrane słowa">
    <span class="slot" id="k0">— — —</span>
    <span class="slot" id="k1">— — —</span>
    <span class="slot" id="k2">— — —</span>
  </div>

  <p class="foot">Adrian Wojtasik · <a href="mailto:eyeamadrian@gmail.com">eyeamadrian@gmail.com</a> · +48 791 632 675</p>
</div>

<script>
(function(){
  "use strict";

  var COMPANY = "Forum Media Polska";
  document.getElementById("addressee").textContent = COMPANY;

  var STAGES = [
    {
      no: "§1",
      eyebrow: "Kontrakt",
      title: "Model ma ocenić odpowiedź ucznia. Wynik trafia prosto do bazy.",
      body: "Poprosiłeś model o ocenę. Wrócił akapit prozy. Program nie umie go użyć, a użytkownik czeka. Która instrukcja sprawia, że to się nie powtórzy?",
      rule: {
        label: "Co wiadomo",
        code: "wejście: odpowiedź ucznia\noczekiwane wyjście: ocena, którą zapisze program\nruch: ~2 000 wywołań dziennie"
      },
      opts: [
        "Poproś ładniej i dopisz „odpowiedz krótko”.",
        "Narzuć schemat odpowiedzi, sprawdzaj go po powrocie i miej gotową ścieżkę na wypadek, gdy się nie zgadza.",
        "Weź większy model — lepszy rzadziej się myli.",
        "Dodaj przykład dobrej odpowiedzi w treści zapytania."
      ],
      answer: 1,
      key: "ZBUDOWANE",
      okTitle: "Dokładnie tak.",
      ok: "Przykład i lepszy model podnoszą szansę. Schemat plus walidacja plus ścieżka awaryjna dają pewność — a przy dwóch tysiącach wywołań dziennie tylko pewność się liczy. Tak działa silnik lekcji w Eyelingo.",
      noTitle: "Blisko, ale to wciąż loteria.",
      no: "Każda z pozostałych odpowiedzi zwiększa prawdopodobieństwo sukcesu. Żadna go nie gwarantuje. Odpowiedź B jest jedyną, po której program wie, co zrobić także wtedy, gdy model się pomyli."
    },
    {
      no: "§2",
      eyebrow: "Pamięć",
      title: "Kiedy pokazać to słowo następnym razem?",
      body: "Uczeń widział słowo trzy razy i za każdym razem odpowiedział poprawnie. Kolejny termin liczy się z reguły poniżej. Za ile dni pokazać je znowu?",
      rule: {
        label: "Reguła",
        code: "nowy odstęp = poprzedni odstęp × łatwość\n\npoprzedni odstęp: 6 dni\nłatwość: 2,5"
      },
      opts: ["Za 6 dni", "Za 15 dni", "Za 21 dni", "Za 30 dni"],
      answer: 1,
      key: "ZWERYFIKOWANE",
      okTitle: "Sześć razy dwa i pół. Zgadza się.",
      ok: "Odstęp rośnie tylko wtedy, gdy uczeń realnie pamięta — a to znaczy, że produkt musi mierzyć wiedzę, a nie aktywność. Dlatego Eyelingo nie ma streaków ani przypominajek: nagradzanie obecności zamiast pamięci psuje tę liczbę.",
      noTitle: "Policzmy razem.",
      no: "6 dni × 2,5 = 15 dni. Cała trudność tego mechanizmu nie leży w mnożeniu, tylko w decyzji, co uznajemy za dowód, że uczeń pamięta."
    },
    {
      no: "§3",
      eyebrow: "Pieniądze",
      title: "Masz budżet na jedną zmianę. Która da najwięcej?",
      body: "Trzy ruchy, jeden kwartał, jeden zespół. Policz i wybierz ten, który podnosi miesięczny przychód najmocniej.",
      rule: {
        label: "Stan wyjściowy",
        code: "1 000 użytkowników w wersji darmowej\n3% z nich wykupuje subskrypcję\ncena: 39 zł / miesiąc\n\nprzychód dziś: 1 170 zł / miesiąc"
      },
      opts: [
        "Sprowadź o połowę więcej użytkowników (1 000 → 1 500).",
        "Podnieś konwersję z 3% na 5%.",
        "Podnieś cenę z 39 zł na 49 zł.",
        "Wszystkie trzy dadzą mniej więcej tyle samo."
      ],
      answer: 1,
      key: "SPRZEDANE",
      okTitle: "Konwersja. 1 950 zł.",
      ok: "Więcej ruchu daje 1 755 zł, wyższa cena 1 470 zł, konwersja 1 950 zł — i jako jedyna nie wymaga budżetu na reklamę ani nie obciąża relacji z obecnymi użytkownikami. Dlatego produkt projektuję od ekranu, na którym ktoś podejmuje decyzję, a nie od funkcji.",
      noTitle: "Liczby mówią co innego.",
      no: "Więcej ruchu: 1 755 zł. Wyższa cena: 1 470 zł. Wyższa konwersja: 1 950 zł. Ruch kosztuje najwięcej, podwyżka uderza w zaufanie, a konwersja to jedyna dźwignia, którą da się poprawić samym produktem."
    }
  ];

  var idx = 0;
  var stageEl = document.getElementById("stage");

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function paintRail(){
    for (var i = 0; i < 3; i++){
      var el = document.getElementById("t" + i);
      el.className = "tick" + (i < idx ? " done" : (i === idx ? " now" : ""));
    }
  }

  function fillKey(i, word){
    var el = document.getElementById("k" + i);
    el.textContent = word;
    el.className = "slot filled";
  }

  function intro(){
    paintRail();
    stageEl.innerHTML =
      '<div class="eyebrow">Zamiast listu motywacyjnego</div>' +
      '<h1>Trzy pytania. Pięć minut. Zero lania wody.</h1>' +
      '<p class="lead">Zbudowałem produkt oparty na modelu językowym i wypuściłem go do ludzi. ' +
      'Zamiast opowiadać, jak myślę, pokażę Wam to na trzech decyzjach, które w tym produkcie realnie podjąłem.</p>' +
      '<p>Każda odsłania jedno słowo. Trzy słowa układają się w sposób, w jaki pracuję.</p>' +
      '<div class="row"><button class="btn" id="go">Zaczynamy</button>' +
      '<span class="muted">Nie ma punktów. Zła odpowiedź też czegoś uczy.</span></div>';
    document.getElementById("go").addEventListener("click", function(){ render(); });
  }

  function render(){
    var s = STAGES[idx];
    paintRail();

    var html =
      '<div class="eyebrow">' + s.no + " · " + esc(s.eyebrow) + '</div>' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<p>' + esc(s.body) + '</p>' +
      '<div class="rule"><span class="label">' + esc(s.rule.label) + '</span>' +
      '<code>' + esc(s.rule.code).replace(/\n/g, "<br>") + '</code></div>' +
      '<div class="opts">';

    for (var i = 0; i < s.opts.length; i++){
      html += '<button class="opt" data-i="' + i + '">' +
              '<span class="key">' + String.fromCharCode(65 + i) + '</span>' +
              '<span>' + esc(s.opts[i]) + '</span></button>';
    }
    html += '</div><div class="fb hidden" id="fb"></div><div class="row" id="row"></div>';
    stageEl.innerHTML = html;

    var buttons = stageEl.querySelectorAll(".opt");
    for (var b = 0; b < buttons.length; b++){
      buttons[b].addEventListener("click", onPick);
    }
  }

  function onPick(ev){
    var s = STAGES[idx];
    var picked = parseInt(ev.currentTarget.getAttribute("data-i"), 10);
    var right = picked === s.answer;
    var buttons = stageEl.querySelectorAll(".opt");

    for (var i = 0; i < buttons.length; i++){
      buttons[i].disabled = true;
      if (i === s.answer) buttons[i].className = "opt correct";
      else if (i === picked) buttons[i].className = "opt wrong";
    }

    var fb = document.getElementById("fb");
    fb.className = "fb";
    fb.innerHTML = "<strong>" + esc(right ? s.okTitle : s.noTitle) + "</strong> " +
                   esc(right ? s.ok : s.no);

    fillKey(idx, s.key);

    var row = document.getElementById("row");
    var btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = idx < 2 ? "Dalej" : "Zobacz wynik";
    btn.addEventListener("click", function(){
      idx++;
      if (idx < 3){ render(); } else { reveal(); }
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    row.appendChild(btn);
    btn.focus();
  }

  function reveal(){
    paintRail();
    stageEl.innerHTML =
      '<div class="eyebrow">Wynik walidacji</div>' +
      '<div class="method">' +
        '<span>Zbudowane.</span><span>Zweryfikowane.</span><span>Sprzedane.</span>' +
      '</div>' +
      '<div class="card">' +
        '<div class="verdict">Specyfikacja spełniona</div>' +
        '<h2>Wygraliście najlepszego kandydata.</h2>' +
        '<p class="name">Adrian Wojtasik · produkt, AI, wdrożenie</p>' +
        '<div class="links">' +
          '<a href="https://eyelingo.app" target="_blank" rel="noopener">eyelingo.app</a>' +
          '<a href="https://github.com/FabianAdrianW" target="_blank" rel="noopener">github.com/FabianAdrianW</a>' +
          '<a href="mailto:eyeamadrian@gmail.com">eyeamadrian@gmail.com</a>' +
        '</div>' +
        '<dl class="decode">' +
          '<dt>§1 sprawdzało</dt><dd>czy potrafię zamienić model językowy w element systemu, na którym da się polegać — a nie w efektowne demo.</dd>' +
          '<dt>§2 sprawdzało</dt><dd>czy rozumiem, że o wartości produktu decyduje logika pod spodem, a nie liczba ekranów.</dd>' +
          '<dt>§3 sprawdzało</dt><dd>czy myślę o pieniądzach od pierwszej linijki. Konwersja to jedyna dźwignia, którą podnosi sam produkt.</dd>' +
        '</dl>' +
      '</div>';
  }

  intro();
})();
</script>
</body>
</html>
